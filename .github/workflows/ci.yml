
name: Mini AI Analyst CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pytest \
            pytest-cov \
            fastapi \
            httpx \
            uvicorn

      - name: Run security API tests
        env:
          AI_ANALYST_KEY: ci-analyst-test-key
          AI_ADMIN_KEY: ci-admin-test-key
        run: |
          python -m pytest \
            lesson13/tests/test_security_api.py \
            --cov=lesson12.security_api \
            --cov-report=term-missing \
            -v
