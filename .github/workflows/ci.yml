
name: Mini AI Analyst CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r lesson13/requirements-ci.txt
          python -m pip install ruff bandit pip-audit

      - name: Run automated tests
        env:
          AI_ANALYST_KEY: ci-analyst-test-key
          AI_ADMIN_KEY: ci-admin-test-key
        run: |
          python -m pytest \
            lesson13/tests/test_security_api.py \
            --cov=lesson12.security_api \
            --cov-report=term-missing \
            -v

      - name: Check Python linting
        run: |
          ruff check lesson12/security_api.py

      - name: Check Python formatting
        run: |
          ruff format --check lesson12/security_api.py

      - name: Run Bandit security scan
        run: |
          bandit -q lesson12/security_api.py

      - name: Audit dependencies
        run: |
          python -m pip_audit \
            -r lesson13/requirements-ci.txt
