
name: Mini AI Analyst Release Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r lesson13/requirements-ci.txt
          python -m pip install ruff bandit pip-audit

      - name: Run automated tests
        run: |
          python -m pytest lesson13/tests/ -v \
            --cov=lesson12.security_api \
            --cov-report=term-missing

      - name: Ruff lint
        run: ruff check lesson12/security_api.py

      - name: Ruff formatting
        run: ruff format --check lesson12/security_api.py

      - name: Bandit security scan
        run: bandit -q lesson12/security_api.py

      - name: Dependency audit
        run: python -m pip_audit -r lesson13/requirements-ci.txt

  publish:
    name: Build and publish Docker image
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: lesson12/Dockerfile.security
          push: true
          tags: ghcr.io/ceste/mini-ai-analyst:${{ github.sha }}

  smoke-test:
    name: Deployment smoke test
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull release image
        run: |
          docker pull ghcr.io/ceste/mini-ai-analyst:${{ github.sha }}

      - name: Start hardened container
        run: |
          docker run -d \
            --name ai-analyst-smoke \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 100 \
            --memory 256m \
            --cpus 1 \
            -p 127.0.0.1:8010:8000 \
            ghcr.io/ceste/mini-ai-analyst:${{ github.sha }}

      - name: Verify application health
        shell: bash
        run: |
          healthy=false

          for attempt in {1..15}; do
            if curl --noproxy '*' \
              --fail --silent \
              --connect-timeout 2 \
              --max-time 3 \
              http://127.0.0.1:8010/health \
              | grep -q '"status":"healthy"'; then
              healthy=true
              break
            fi

            echo "Waiting for health: $attempt/15"
            sleep 2
          done

          if [ "$healthy" != true ]; then
            echo "Deployment smoke test failed"
            exit 1
          fi

          echo "Deployment smoke test passed"

      - name: Verify non-root execution
        run: |
          docker exec ai-analyst-smoke id
          test "$(docker exec ai-analyst-smoke id -u)" = "999"

      - name: Show container logs
        if: always()
        run: |
          docker logs ai-analyst-smoke 2>&1 || true
