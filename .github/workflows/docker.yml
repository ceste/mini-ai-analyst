
name: Mini AI Analyst Docker Build

on:
  push:
    branches:
      - main
    paths:
      - "lesson12/Dockerfile.security"
      - "lesson12/container_security_api.py"
      - ".dockerignore"
      - ".github/workflows/docker.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: lesson12/Dockerfile.security
          push: true
          tags: |
            ghcr.io/ceste/mini-ai-analyst:latest
            ghcr.io/ceste/mini-ai-analyst:${{ github.sha }}
